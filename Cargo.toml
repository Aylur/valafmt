[package]
name = "valafmt"
version = "0.3.0"
edition = "2021"
description = "An opinionated code formatter for the Vala programming language"
license = "MIT"
repository = "https://github.com/Aylur/valafmt"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ec4rs = "1.2.0"
ignore = "0.4"

[dev-dependencies]
insta = { version = "1", features = ["glob"] }
